[project]
name = "langgraph-review-workflow"
version = "0.1.0"
description = "Public-safe LangGraph workflow for evidence-grounded candidate-to-role review."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Portfolio Project" }
]
dependencies = [
  "langgraph>=0.2.0",
  "langchain-core>=0.3.0",
  "pydantic>=2.0.0",
  "typer>=0.12.0",
  "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[project.scripts]
review-workflow = "langgraph_review_workflow.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: calls a local Ollama model; skipped unless RUN_LIVE=1 and Ollama is reachable",
]

[tool.ruff]
line-length = 100
target-version = "py310"
